#wrapper{opacity:1;background:#000;position:absolute;top:0;left:0;width:100%;height:100%}

canvas{opacity:1;background:#000;display:block;width:100%;height:100%}

.loader{width:100%;height:100%;position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;color:#fff;text-align:center;display:table;user-select:none;background:transparent;z-index:20;transition:opacity 2s ease}

.loader__content{display:table-cell;vertical-align:middle;padding:20px}
.bform{width:400px;max-width:92vw;margin:0 auto;position:relative}
.bform header{position:relative;z-index:6;background:#fff;padding:20px 40px;border-radius:15px 15px 0 0;text-align:left;overflow:hidden}

.bform header p{color:#9f9f9f;font-size:19px;margin:5px 0 0;font-family:"Caveat Brush",cursive}
.bform form{position:relative;height:75px;min-height:112px}
.bform .input-section{width:100%;position:absolute;display:flex;left:50%;transform:translate(-50%,0);height:75px;border-radius:0 0 15px 15px;overflow:hidden;z-index:5;background:rgba(12,12,12,.92);border:1px solid #333;border-top:none;box-shadow:0 0 100px rgba(0,0,0,.5);transition:all .25s ease-in}
.bform .input-section.folded{width:95%;margin-top:10px;z-index:4;background:#1a1a1a}
.bform .input-section.folded + .folded{width:90%;margin-top:20px;z-index:3;background:#141414}
.bform .input-section.folded + .folded + .folded{width:85%;margin-top:30px;z-index:2}
.bform .input-section.fold-up{margin-top:-75px}
.bform .input-section input{flex:1;background:transparent;color:#fff;border:0;padding:20px 0 20px 40px;margin:0;font-size:19px;letter-spacing:.5px;user-select:text;-webkit-user-select:text;cursor:text;font-family:"Caveat Brush",cursive;min-width:0}
.bform .input-section input:focus{outline:none}
.bform .input-section input::placeholder{color:#8a8a8a;font-weight:100}
.bform .card-btns{display:flex;align-items:center;gap:4px;padding-right:14px}
.bform .card-btns button{background:none;border:1px solid #555;color:#fff;border-radius:8px;min-width:38px;height:38px;font-size:16px;cursor:pointer;transition:all .2s}
.bform .card-btns button:hover{background:#fff;color:#000;border-color:#fff}
.bform .card-btns button svg{width:18px;height:18px;display:block;flex:none}
.bform .card-btns button{display:flex;align-items:center;justify-content:center}
.bform .card-btns button.next{border-color:#fff}
.bform .card-btns button.ampm{font-size:11px;letter-spacing:1px;opacity:.55}
.bform .card-btns button.ampm.on{background:#fff;color:#000;opacity:1}
.bform .card-btns button.mic.rec{border-color:#f66;color:#f66;animation:micpulse 1s infinite}
@keyframes micpulse{50%{opacity:.45}}
.bform .success{width:100%;position:absolute;display:flex;align-items:center;left:50%;transform:translate(-50%,0);height:75px;border-radius:0 0 15px 15px;overflow:hidden;z-index:5;background:#fff;margin-top:0;transition:all .25s ease-in}
.bform .success.folded{width:90%;margin-top:20px;z-index:1;background:#222}
.bform .success p{color:#000;font-weight:400;letter-spacing:1px;font-size:24px;width:100%;text-align:center;font-family:"Caveat Brush",cursive}
.bform .confirmbox{display:flex;align-items:center;width:100%}
.bform .confirmbox p{flex:1;color:#000;font-size:17px;margin:0;padding-left:40px;font-family:"Caveat Brush",cursive;text-align:left;min-width:0}
.bform .confirmbox .card-btns button{border-color:#111;color:#111}
.bform .confirmbox .card-btns button:hover{background:#111;color:#fff}
.skip{margin-top:20px;font-family:"Caveat Brush",cursive;font-size:17px;color:rgba(255,255,255,.45);cursor:pointer}
.skip:hover{color:#fff}
/* glass-crack cinematic over the card stack (pure CSS, no deps) */
.bform.crack-intro{animation:bm-scale 3s linear forwards,bm-blur .142s linear 14 alternate-reverse,bm-quiver .1s ease-in 10 alternate-reverse,bm-shake .05s ease-in 20 alternate-reverse;transform-origin:center}
.bform.mini-shake{animation:bm-jolt .15s ease-in 2 alternate-reverse}
@keyframes bm-scale{to{scale:1.04}}
@keyframes bm-blur{to{filter:blur(.6px)}}
@keyframes bm-quiver{to{translate:0 -1px}}
@keyframes bm-shake{to{translate:0 -3px}}
@keyframes bm-jolt{to{translate:1px -2px}}
#bm-crack{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;opacity:0}
#bm-crack .draw{stroke-dasharray:100;stroke-dashoffset:100}
#loader.cracking #bm-crack,#loader.cracking #bm-crack-g{animation:crackshow .8s ease forwards}
#loader.cracking #bm-crack .draw{animation:crackdraw .12s linear forwards}
@keyframes crackshow{0%{opacity:0}12%{opacity:1}55%{opacity:1}100%{opacity:0}}
@keyframes crackdraw{to{stroke-dashoffset:0}}
/* glass-crack 3-piece title split (left / middle / right) */
.bm-title{position:relative}
.bm{display:block}
.bml,.bmr{position:absolute;inset:0}
header.cracking .bml{animation:bmcrackL .1s linear forwards}
header.cracking .bmm{animation:bmcrackM .1s linear forwards}
header.cracking .bmr{animation:bmcrackR .1s linear forwards}
@keyframes bmcrackL{to{clip-path:polygon(-6% -6%,40% -6%,31% 28%,37% 55%,29% 80%,33% 106%,-6% 106%);translate:-3px 1px}}
@keyframes bmcrackM{to{clip-path:polygon(40% -6%,64% -6%,58% 30%,63% 60%,56% 106%,33% 106%,29% 80%,37% 55%,31% 28%)}}
@keyframes bmcrackR{to{clip-path:polygon(64% -6%,106% -6%,106% 106%,56% 106%,63% 60%,58% 30%);translate:3px -1px}}
.bform.crack-intro header h1{animation:bm-hblur .142s linear 14 alternate-reverse}
@keyframes bm-hblur{to{filter:blur(.8px)}}
@media (prefers-reduced-motion:reduce){.bform.crack-intro,.bform.mini-shake{animation:none}#bm-crack{display:none}}
.voice__status{font-family:"Caveat Brush",cursive;font-size:1.05em;opacity:.7;min-height:1.2em;margin:.6em 0 0}
.voice__echo{font-family:"Caveat Brush",cursive;font-size:1.05em;opacity:.9;font-style:italic;max-width:400px;margin:.3em auto 0}
#result{position:absolute;left:12px;bottom:10px;z-index:12;color:rgba(255,255,255,.78);font-family:"Caveat Brush",cursive;font-size:15px;text-align:left;display:none;line-height:1.7;max-width:44vw}
.controls{position:absolute;top:5px;left:10px;display:none;z-index:15}
.controls__open{width:25px;height:25px;background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyAQMAAAAk8RryAAAABlBMVEUAAAD///+l2Z/dAAAAAXRSTlMAQObYZgAAABRJREFUGNNjoBv4DwQHEPSo+VgBAFO/HGnvnD82AAAAAElFTkSuQmCC");background-size:contain;position:absolute;top:15px;left:15px;opacity:.5;cursor:inherit;transition:all .3s linear;display:block}
.controls__open:hover{opacity:1}
.note{position:absolute;right:10px;bottom:5px;opacity:0;text-align:right;color:rgba(255,255,255,.6);font-family:"Caveat Brush",cursive;font-size:15px;z-index:10;transition:opacity 2s ease}
.note a{color:rgba(255,255,255,.8)}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:#111;color:#aaa;z-index:30;transform:translateX(-102%);transition:transform .35s ease;font-family:"Caveat Brush",cursive;overflow-y:auto;box-shadow:2px 0 20px rgba(0,0,0,.6)}
.drawer.open{transform:translateX(0)}
.drawer__bar{padding:20px 15px}
.drawer h1{font-size:24px;font-family:"Caveat Brush",cursive;font-weight:400;border-left:3px solid #fff;padding-left:10px;color:#fff;margin:0 0 10px}
.drawer ul{list-style:none;margin:0 0 40px;padding:0}
.drawer li{border-top:1px solid rgba(255,255,255,.08)}
.offcanvas__item{padding:12px 10px;margin:0;position:relative;cursor:inherit}
.offcanvas__item:hover{color:#fff;background:rgba(255,255,255,.05)}
.switch{width:6px;height:6px;border-radius:50%;position:absolute;top:0;bottom:0;right:10px;margin:auto;border:1px solid grey}
.switch--on{background:grey}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:25}
.scrim.show{opacity:1;pointer-events:auto}
.drawer__close{background:none;border:none;color:#aaa;font-size:22px;position:absolute;top:10px;right:12px;cursor:inherit}
</style>

<div id="wrapper" class="wrapper">
<canvas id="canvas"></canvas>
<canvas id="stars"></canvas>
<div id="drawer" class="drawer"><div class="drawer__bar">
<button class="drawer__close" id="drawer__close" aria-label="Close">×</button>
<h1>Options</h1>
<ul>
<li><div id="controls__reset" class="offcanvas__item">Reset</div></li>
<li><div id="controls__mute" class="offcanvas__item">Mute <span class="switch"></span></div></li>
<li><div id="controls__rimlight" class="offcanvas__item">Rim light <span class="switch"></span></div></li>
</ul>
<h1>Animations</h1>
<ul>
<li><div id="controls__sinX" class="offcanvas__item">SinX <span class="switch"></span></div></li>
<li><div id="controls__sinZ" class="offcanvas__item">SinZ <span class="switch"></span></div></li>
<li><div id="controls__sinXZ" class="offcanvas__item">SinXZ <span class="switch"></span></div></li>
</ul>
</div></div>
<div id="scrim" class="scrim"></div>

</section>
<section class="input-section folded" data-field="time">
<input id="f_time" placeholder="TIME — 6:40" autocomplete="off">
<div class="card-btns"><button type="button" class="ampm" data-ap="AM">AM</button><button type="button" class="ampm" data-ap="PM">PM</button><button type="button" class="mic" data-field="time" aria-label="Speak time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="9.3" rx="2.1" ry="1.6" fill="currentColor"/><circle cx="8.9" cy="6.3" r="0.95" fill="currentColor"/><circle cx="12" cy="5.3" r="0.95" fill="currentColor"/><circle cx="15.1" cy="6.3" r="0.95" fill="currentColor"/><rect x="10.9" y="13.6" width="2.2" height="5.6" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 21.2 Q12 18 17.5 21.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><button type="button" class="next" data-field="time" aria-label="Next">→</button></div>
</section>
<section class="input-section folded" data-field="place">
<input id="f_place" placeholder="BIRTH PLACE — KOLKATA" autocomplete="off">
<div class="card-btns"><button type="button" class="mic" data-field="place" aria-label="Speak place"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="9.3" rx="2.1" ry="1.6" fill="currentColor"/><circle cx="8.9" cy="6.3" r="0.95" fill="currentColor"/><circle cx="12" cy="5.3" r="0.95" fill="currentColor"/><circle cx="15.1" cy="6.3" r="0.95" fill="currentColor"/><rect x="10.9" y="13.6" width="2.2" height="5.6" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 21.2 Q12 18 17.5 21.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><button type="button" class="next" data-field="place" aria-label="Finish">✈</button></div>
</section>
<section class="success folded" data-field="done"><div class="confirmbox"><p id="confirm__lines"></p><div class="card-btns"><button type="button" id="confirm__yes" aria-label="Confirm">✓</button><button type="button" id="confirm__no" aria-label="Restart">↻</button></div></div><p id="success__done" style="display:none">STARS ALIGNED</p></section>
</form>

const seg=mono.subarray(a,b+1);
const ratio=sr/16000,len=Math.max(1,Math.floor(seg.length/ratio)),out=new Float32Array(len);
for(let i=0;i<len;i++){const s=Math.floor(i*ratio),e=Math.min(seg.length,Math.floor((i+1)*ratio));
let acc=0,c=0;for(let j=s;j<e;j++){acc+=seg[j];c++;}out[i]=c?acc/c:seg[Math.min(seg.length-1,s)];}
let mean=0;for(let i=0;i<len;i++)mean+=out[i];mean/=Math.max(1,len);
let peak=0,rms=0;for(let i=0;i<len;i++){out[i]-=mean;const v=Math.abs(out[i]);rms+=out[i]*out[i];if(v>peak)peak=v;}
rms=Math.sqrt(rms/Math.max(1,len));
const quiet=rms<0.015;
if(peak>1e-4){const g=Math.min(30,0.9/peak);for(let i=0;i<len;i++)out[i]*=g;}
const m=Math.min(len,1600);for(let i=len-m;i<len;i++)out[i]=0;
return{audio:out,quiet,dur:len/16000};}
async function transcribe(blob){
if(!blob||!blob.size)throw new Error('empty recording');
const ab=await blob.arrayBuffer();
const AC=window.AudioContext||window.webkitAudioContext;let actx;
try{actx=new AC();}catch(e){throw new Error('no audio engine');}
let buf;try{buf=await actx.decodeAudioData(ab);}finally{try{await actx.close();}catch(e){}}
const pre=prepAudio(buf);
if(pre.dur<0.4)throw new Error('too short');
const w=await ensureWhisper();
const feature=await w.processor(pre.audio);
const hop=(w.processor.feature_extractor&&w.processor.feature_extractor.config&&w.processor.feature_extractor.config.hop_length)||160;
const frames=Math.max(1,Math.floor(pre.audio.length/hop));
const genOpts={num_frames:frames};
try{const dpids=w.tokenizer.get_decoder_prompt_ids({language:'english',task:'transcribe',no_timestamps:true});
if(dpids&&dpids.length)genOpts.forced_decoder_ids=dpids;}catch(e){}
const data=await w.model.generate(feature.input_features,genOpts);
const tp=w.processor.feature_extractor.config.chunk_length/w.model.config.max_source_positions;
const dec=w.tokenizer._decode_asr([{tokens:data[0],stride:[pre.audio.length,0,0]}],{time_precision:tp,return_timestamps:false,force_full_sequences:false});
const text=((Array.isArray(dec)?dec[0]:(dec&&(dec.text||dec)))||'').trim();
return{text,quiet:pre.quiet};}
function showRescue(){setStatus('Mic unavailable — type answers in the cards.');say('Mic unavailable. Please type your answers.');}
async function startListen(btn){if(busy){setStatus('Working… one moment.');return;}activeMicBtn=btn||null;
whisperDead=false;whisperWhy='';
try{
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showRescue();return;}
await ensureWhisper();
const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
const my=[];chunks=my;const rec=new MediaRecorder(stream);mediaRec=rec;
rec.ondataavailable=e=>{if(e.data.size)my.push(e.data);};
rec.onstop=()=>{try{stream.getTracks().forEach(t=>t.stop());}catch(e){}
onUtterance(new Blob(my,{type:rec.mimeType||'audio/webm'}));};
rec.start();recording=true;if(activeMicBtn)activeMicBtn.classList.add('rec');
setStatus('Speak now — tap the mic again to stop.');
if(recTimer)clearTimeout(recTimer);recTimer=setTimeout(()=>{if(recording)stopListen();},12000);
}catch(err){useFallback();}}
function useFallback(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){setStatus('Mic unavailable — type answers in the cards.');say('Mic unavailable. Please type your answers.');return;}
try{recording=true;let got=false;const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;
const field=utterTarget;
setStatus('Listening (built-in voice)… speak now.');
rec.onresult=e=>{got=true;const txt=((e.results[0]||[])[0]||{}).transcript||'';
if(txt&&field)handleField(field,String(txt).trim());else setStatus('Did not catch that — tap mic and try again, or type.');};
rec.onerror=()=>setStatus('Did not catch that — tap mic and try again, or type.');
rec.onend=()=>{recording=false;if(activeMicBtn)activeMicBtn.classList.remove('rec');activeMicBtn=null;
if(!got){utterTarget=null;setStatus('Heard nothing — move closer and tap mic again, or type.');}};
if(activeMicBtn)activeMicBtn.classList.add('rec');rec.start();
}catch(e){recording=false;setStatus('Mic unavailable — type answers in the cards.');}}
function stopListen(){if(recTimer){clearTimeout(recTimer);recTimer=null;}
if(mediaRec&&recording){recording=false;
if(activeMicBtn)activeMicBtn.classList.remove('rec');activeMicBtn=null;
try{mediaRec.stop();}catch(e){onUtterance(new Blob(chunks));}}}
async function onUtterance(blob){if(busy){setStatus('Working… one moment.');return;}busy=true;
try{setStatus('Hearing you…');const r=await transcribe(blob);const text=r.text;
if(!text){utterTarget=null;
if(r.quiet){setStatus('Too quiet — move closer and speak up, then tap mic.');say('Too quiet. Move closer and try again.');}
else setStatus('Did not catch that — tap mic and try again.');}
busy=false;return;
if(utterTarget){const k=utterTarget;utterTarget=null;handleField(k,text);}else setEcho('“'+text+'”');
}catch(err){const msg=String((err&&err.message)||err);
if(/empty|too short/i.test(msg))setStatus('That was '+msg+' — tap mic, speak, then stop.');
else{setStatus('Voice engine failed ('+msg.slice(0,110)+') — tap mic to retry, or type below.');showRescue();}utterTarget=null;}busy=false;}
// ---------- unfolding birth cards: per-field voice + typed, auto-advance ----------
let utterTarget=null;
const ORDER=['name','dob','time','place'];
const secs={};document.querySelectorAll('#bform .input-section').forEach(s=>{secs[s.dataset.field]=s;});
if(!fields)fields={name:null,dob:null,time:null,place:null,tz:null,tzKey:null};
let cur=0,chipAP=null;
function setChips(ap){chipAP=ap;document.querySelectorAll('.ampm').forEach(b=>b.classList.toggle('on',b.dataset.ap===ap));}
document.querySelectorAll('.ampm').forEach(b=>b.addEventListener('click',()=>setChips(b.dataset.ap)));
function paintCards(){ORDER.forEach((k,j)=>{const s=secs[k];if(!s)return;
s.classList.remove('fold-up');s.classList.toggle('folded',j>cur);if(j<cur)s.classList.add('fold-up');});
const nx=secs[ORDER[cur]];if(nx){const inp=nx.querySelector('input');if(inp)setTimeout(()=>{try{inp.focus();}catch(e){}},300);}}
function readCard(k){const el=$('f_'+k),v=el?el.value.trim():'';
if(!v)return{ok:false,msg:'empty'};
if(k==='name')return{ok:true,val:cap(v.split(/\s+/).slice(0,3).join(' '))};
if(k==='dob'){const p=parseDetails('on '+v);return p.dob?{ok:true,val:p.dob}:{ok:false,msg:'date'};}
if(k==='time'){const p=parseDetails('at '+v);let t=p.time;
if(!t||!t.ap){if(!chipAP)return{ok:false,msg:'ampm'};
let h=+(((v.match(/(\d{1,2})/)||[])[1])||0);
if(chipAP==='AM'&&h===12)h=0;if(chipAP==='PM'&&h<12)h+=12;
const mm=v.match(/:(\d{2})/);t={h,min:mm?+mm[1]:0,ap:chipAP};}
setChips(t.ap);return{ok:true,val:t};}
const p=parseDetails('born in '+v);return p.place?{ok:true,val:{place:p.place,tz:p.tz,tzKey:p.tzKey}}:{ok:false,msg:'place'};}
function commitCard(k){const r=readCard(k);
if(!r.ok){const hint={empty:'Say or type your '+k+'.',date:'Use e.g. 12 March 1998.',ampm:'Pick AM or PM, or say morning/evening.',place:'Which city were you born in?'}[r.msg];
setStatus(hint);say('Please give me '+k+'.');return false;}
if(k==='place'){fields.place=r.val.place;fields.tz=r.val.tz;fields.tzKey=r.val.tzKey;}else fields[k]=r.val;
crackFlicker(secs[ORDER[cur]]);
if(cur<ORDER.length-1){cur++;paintCards();}
else{showConfirm();}
return true;}
function fmt24(t){return String(t.h).padStart(2,'0')+':'+String(t.min).padStart(2,'0');}
function tzLabel(){const e=(fields.tz||0)+dstOffset(fields.tzKey,fields.dob);
const s=e<0?'-':'+',a=Math.abs(e),hh=Math.floor(a),mm=Math.round((a-hh)*60);
return 'UTC'+s+hh+(mm?':'+String(mm).padStart(2,'0'):'');}
function showConfirm(){const sc=document.querySelector('#bform .success');if(sc)sc.classList.remove('folded');
const MN=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const L=$('confirm__lines');
if(L)L.innerHTML=`<b>${fields.name}</b> · ${fields.dob.d} ${MN[fields.dob.m]} ${fields.dob.y} · ${fmt24(fields.time)} · ${fields.place} (${tzLabel()})`;
setStatus('Check it — ✓ to reveal, ↻ to restart.');say('Check your details. Confirm, or restart.');}
const cyy=$('confirm__yes');if(cyy)cyy.addEventListener('click',()=>{
const cb=document.querySelector('#bform .confirmbox');if(cb)cb.style.display='none';
const sd=$('success__done');if(sd)sd.style.display='block';
setStatus('Stars aligned.');setTimeout(()=>lockIn(),1200);});
const cnn=$('confirm__no');if(cnn)cnn.addEventListener('click',()=>resetFlow());
function resetFlow(){fields={name:null,dob:null,time:null,place:null,tz:null,tzKey:null};chipAP=null;setChips(null);
['f_name','f_dob','f_time','f_place'].forEach(id=>{const el=$(id);if(el)el.value='';});
const cb=document.querySelector('#bform .confirmbox');if(cb)cb.style.display='';
const sd=$('success__done');if(sd)sd.style.display='none';
const sc=document.querySelector('#bform .success');if(sc)sc.classList.add('folded');
cur=0;paintCards();setStatus('Start over — name first.');}
function handleField(k,text){const upd=parseDetails(text);setEcho('“'+text+'”');
const MN=['','January','February','March','April','May','June','July','August','September','October','November','December'];
if(k==='name'&&upd.name)$('f_name').value=upd.name;
if(k==='dob'&&upd.dob)$('f_dob').value=`${upd.dob.d} ${MN[upd.dob.m]} ${upd.dob.y}`;
if(k==='time'&&upd.time){const t=upd.time;$('f_time').value=`${t.h%12===0?12:t.h%12}${t.min?':'+String(t.min).padStart(2,'0'):''}`;setChips(t.ap);}
if(k==='place'&&upd.place)$('f_place').value=upd.place;
if(commitCard(k)){if(cur<ORDER.length)say('Next.');}}
document.querySelectorAll('#bform .next').forEach(b=>b.addEventListener('click',()=>{commitCard(b.dataset.field);}));
document.querySelectorAll('#bform .mic').forEach(b=>b.addEventListener('click',()=>{
if(busy){setStatus('Working… one moment.');return;}
if(recording){stopListen();setStatus('Heard that one — tap mic again for this card.');return;}
utterTarget=b.dataset.field;startListen(b);}));
paintCards();
// preload voice model on page load so failure surfaces early with the real reason
async function preloadVoice(){try{await ensureWhisper();}
catch(e){whisperDead=true;whisperWhy=String((e&&e.message)||e).slice(0,120);
setStatus('Voice model failed ('+whisperWhy+'). Built-in voice will be used.');}}
if(document.readyState==='complete')preloadVoice();else addEventListener('load',preloadVoice);
// glass-crack intro: 3s scale/blur/quiver/shake on the stack, crack + split inside the header only
const bformEl=document.querySelector('.bform');
function crackFlicker(el){const t=el||bformEl;if(!t||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
t.classList.remove('mini-shake');void t.offsetWidth;t.classList.add('mini-shake');
setTimeout(()=>t.classList.remove('mini-shake'),400);}
if(bformEl&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
bformEl.classList.add('crack-intro');
setTimeout(()=>bformEl.classList.remove('crack-intro'),3200);
setTimeout(()=>{const hb=document.querySelector('.bform header');const ld=document.getElementById('loader');
if(hb){hb.classList.add('cracking');setTimeout(()=>hb.classList.remove('cracking'),1100);}
if(ld){ld.classList.add('cracking');setTimeout(()=>ld.classList.remove('cracking'),1100);}
bformEl.classList.add('mini-shake');setTimeout(()=>bformEl.classList.remove('mini-shake'),400);},2900);}
function lockIn(){const miss=missing(fields);
if(miss.length){setStatus('Still need: '+miss.join(', ')+'.');return;}
let prof;try{prof=computeProfile(fields);}catch(e){setStatus('Date looks invalid — check the cards.');return;}
const seed=`${fields.name}|${fields.dob.y}-${fields.dob.m}-${fields.dob.d}|${prof.nakIdx}`;
window.BIGCATseed=seed;window.BIGCATprof=prof;
const res=$('result');
if(res){res.style.display='block';res.style.cursor='pointer';res.title='Tap to replay your stars';
const MN2=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const heard=`${fields.dob.d} ${MN2[fields.dob.m]} ${fields.dob.y} · ${fmt24(fields.time)} · ${fields.place} (${tzLabel()})`;
res.innerHTML=`<b>${fields.name}</b> · ${prof.nak} (pada ${prof.pada})<br>Moon sign ${prof.rashi} · Lord ${prof.lord}${prof.borderline?'<br><i>Near a cusp — verify with exact ephemeris.</i>':''}<br><span style="opacity:.75">Heard: ${heard}</span><br>by Lustersourav<br><span style="opacity:.6">↻ tap to replay</span> · <span id="res__edit" style="opacity:.6;text-decoration:underline">✎ correct details</span>`;
res.onclick=()=>{try{const bp=window.BIGCATprof||{};if(window.BIGCAT)window.BIGCAT.revealPersonalSky(window.BIGCATseed,bp.nak||'',bp.nakIdx||0);say('Showing your star again.');}catch(e){}};
const re=$('res__edit');if(re)re.addEventListener('click',e=>{e.stopPropagation();reopenCards();});}
function reopenCards(){const l=$('loader');if(l){l.style.display='table';l.classList.remove('loader--out');}
const res2=$('result');if(res2)res2.style.display='none';
cur=0;paintCards();setStatus('Correct any card, then confirm again.');say('Correct any card, then confirm.');}
setStatus('Stars aligned. Look up.');setEcho('');
say(`Your birth star is ${prof.nak}, pada ${prof.pada}. Moon sign ${prof.rashi}.`);
try{$('loader__cta').click();}catch(e){}
setTimeout(()=>{try{if(window.BIGCAT)window.BIGCAT.revealPersonalSky(seed,prof.nak,prof.nakIdx);}catch(e){}},2600);}
